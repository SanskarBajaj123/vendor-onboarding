# Keeps this project's Supabase free-tier DB alive by triggering activity every 3 days (auto-pause threshold: 7 days).
name: keep-supabase-alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC every 3 days
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase DB
    runs-on: ubuntu-latest

    steps:
      - name: Ping vendor-onboarding DB via health endpoint
        run: |
          echo "Pinging /health/db..."
          STATUS=$(curl --silent --max-time 30 --retry 2 --retry-delay 5 \
            -w "%{http_code}" -o /tmp/body.txt \
            "https://dev-s-vendor-onboarding.vercel.app/health/db")
          echo "Response: $(cat /tmp/body.txt)"
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Error: got HTTP $STATUS"
            exit 1
          fi
          echo "DB ping OK"
